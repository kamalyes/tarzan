apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector-openapi
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - nodes
      - nodes/metrics
      - services
      - endpoints
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector-openapi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector-openapi
subjects:
  - kind: ServiceAccount
    name: default
    namespace: {{OTEL_OPENAPI_NAMESPACE}}
---
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: openapi-otel
  namespace: {{OTEL_OPENAPI_NAMESPACE}}
spec:
  mode: daemonset
  image: {{OTEL_COLLECTOR_IMAGE}}
  volumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
  volumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
  config: |
    receivers:
      filelog:
        include:
          - /var/log/pods/*/*/*.log
        exclude:
          - /var/log/pods/*/*/*.gz
          - /var/log/pods/*/*/*.zip
        start_at: end
        include_file_path: true
        operators:
          - type: container
          - type: json_parser
            id: universal_json_parser
            parse_from: body
            parse_to: body
      prometheus:
        config:
          scrape_configs:
            - job_name: kubernetes-pods
              scrape_interval: 30s
              kubernetes_sd_configs:
                - role: pod
              relabel_configs:
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  action: keep
                  regex: "true"
                - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  action: replace
                  target_label: __metrics_path__
                  regex: (.+)
                - source_labels: [__meta_kubernetes_namespace]
                  action: replace
                  target_label: namespace
                - source_labels: [__meta_kubernetes_pod_name]
                  action: replace
                  target_label: pod
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
      k8sattributes:
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
      transform:
        log_statements:
          - context: log
            statements:
              - set(resource.attributes["namespace"], resource.attributes["k8s.namespace.name"])
              - set(resource.attributes["pod"], resource.attributes["k8s.pod.name"])
      batch:
        send_batch_size: 1024
        timeout: 5s
    exporters:
      otlphttp:
        endpoint: http://openobserve-0.openobserve.monitoring.svc:5080/api/default
        headers:
          Authorization: Basic {{OPENOBSERVE_BASIC_AUTH}}
          stream-name: default
    service:
      pipelines:
        logs:
          receivers: [filelog]
          processors: [memory_limiter, k8sattributes, transform, batch]
          exporters: [otlphttp]
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlphttp]
