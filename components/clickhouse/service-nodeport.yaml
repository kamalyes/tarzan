apiVersion: v1
kind: Service
metadata:
  name: clickhouse-nodeport
  namespace: {{COMPONENT_NAMESPACE}}
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: http
      nodePort: 30011
    - name: native
      port: 9000
      targetPort: native
      nodePort: 30010
