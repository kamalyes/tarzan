apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: {{COMPONENT_NAMESPACE}}
  labels:
    app.kubernetes.io/name: clickhouse
spec:
  serviceName: clickhouse
  replicas: {{CLICKHOUSE_REPLICAS}}
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
    spec:
      initContainers:
        - name: prepare-data-dir
          image: {{CLICKHOUSE_IMAGE}}
          imagePullPolicy: {{KUBE_IMAGE_PULL_POLICY}}
          command:
            - /bin/sh
            - -ec
            - |
              mkdir -p /var/lib/clickhouse
              chown -R clickhouse:clickhouse /var/lib/clickhouse
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
      containers:
        - name: clickhouse
          image: {{CLICKHOUSE_IMAGE}}
          imagePullPolicy: {{KUBE_IMAGE_PULL_POLICY}}
          env:
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{COMPONENT_SECRETS}}
                  key: CLICKHOUSE_USER
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{COMPONENT_SECRETS}}
                  key: CLICKHOUSE_PASSWORD
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 1500m
              memory: 6Gi
            limits:
              cpu: 3
              memory: 10Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{LONGHORN_STORAGE_CLASS}}
        resources:
          requests:
            storage: 50Gi
