apiVersion: v1
kind: Service
metadata:
  name: valkey-{{VALKEY_NAME}}-nodeport
  namespace: {{COMPONENT_NAMESPACE}}
  labels:
    app.kubernetes.io/name: valkey-{{VALKEY_NAME}}
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: valkey-{{VALKEY_NAME}}
    statefulset.kubernetes.io/pod-name: valkey-{{VALKEY_NAME}}-0
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      nodePort: {{VALKEY_NODEPORT}}
