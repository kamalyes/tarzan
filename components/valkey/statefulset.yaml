apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: valkey-{{VALKEY_NAME}}
  namespace: {{COMPONENT_NAMESPACE}}
  labels:
    app.kubernetes.io/name: valkey-{{VALKEY_NAME}}
spec:
  serviceName: valkey-{{VALKEY_NAME}}
  replicas: {{VALKEY_REPLICAS}}
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey-{{VALKEY_NAME}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: valkey-{{VALKEY_NAME}}
    spec:
      containers:
        - name: valkey
          image: {{VALKEY_IMAGE}}
          imagePullPolicy: {{KUBE_IMAGE_PULL_POLICY}}
          command:
            - /bin/sh
            - -ec
            - |
              exec valkey-server /etc/valkey/valkey.conf --requirepass "${VALKEY_PASSWORD}" --masterauth "${VALKEY_PASSWORD}"
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{COMPONENT_SECRETS}}
                  key: {{VALKEY_PASSWORD_KEY}}
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: config
              mountPath: /etc/valkey
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - valkey-cli -a "${VALKEY_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: valkey-{{VALKEY_NAME}}-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{LONGHORN_STORAGE_CLASS}}
        resources:
          requests:
            storage: 10Gi
