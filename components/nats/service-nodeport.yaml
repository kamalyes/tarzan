apiVersion: v1
kind: Service
metadata:
  name: nats-nodeport
  namespace: {{COMPONENT_NAMESPACE}}
  labels:
    app.kubernetes.io/name: nats
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client
      nodePort: 30016
