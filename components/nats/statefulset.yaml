apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: {{COMPONENT_NAMESPACE}}
  labels:
    app.kubernetes.io/name: nats
spec:
  serviceName: nats
  podManagementPolicy: Parallel
  replicas: {{NATS_REPLICAS}}
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      containers:
        - name: nats
          image: {{NATS_IMAGE}}
          imagePullPolicy: {{KUBE_IMAGE_PULL_POLICY}}
          command:
            - nats-server
          args:
            - -c
            - /etc/nats/nats.conf
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NATS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{COMPONENT_SECRETS}}
                  key: NATS_TOKEN
          ports:
            - name: client
              containerPort: 4222
            - name: cluster
              containerPort: 6222
            - name: monitor
              containerPort: 8222
          volumeMounts:
            - name: config
              mountPath: /etc/nats
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 300m
              memory: 1Gi
            limits:
              cpu: 1
              memory: 2Gi
      volumes:
        - name: config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{LONGHORN_STORAGE_CLASS}}
        resources:
          requests:
            storage: 20Gi
