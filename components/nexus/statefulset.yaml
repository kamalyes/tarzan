apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexus
  namespace: {{COMPONENT_NAMESPACE}}
  labels:
    app.kubernetes.io/name: nexus
spec:
  serviceName: nexus
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nexus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nexus
    spec:
      containers:
        - name: nexus
          image: {{NEXUS_IMAGE}}
          imagePullPolicy: {{KUBE_IMAGE_PULL_POLICY}}
          env:
            # JVM 堆与堆外(默认堆 2703m 过大, 中小集群按下调, 不足时在此调整)
            - name: INSTALL4J_ADD_VM_PARAMS
              value: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=2g"
          ports:
            - name: web
              containerPort: 8081
          volumeMounts:
            - name: data
              mountPath: /nexus-data
          readinessProbe:
            httpGet:
              path: /service/rest/v1/status
              port: web
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 20
          livenessProbe:
            tcpSocket:
              port: web
            initialDelaySeconds: 180
            periodSeconds: 30
          resources:
            requests:
              cpu: 300m
              memory: 2Gi
            limits:
              cpu: "1"
              memory: 4Gi
      securityContext:
        # nexus 官方镜像以 uid 200 运行
        fsGroup: 200
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{LONGHORN_STORAGE_CLASS}}
        resources:
          requests:
            storage: 50Gi
